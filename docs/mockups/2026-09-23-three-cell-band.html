<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three-cell band</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #12151c; color: #d8d4cc;
         font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { width: 1280px; margin: 0 auto; }
  h1 { font-size: 16px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
  p.note { color: #9a968e; max-width: 80ch; }
  figure { margin: 32px 0; }
  figcaption { margin-bottom: 8px; font-weight: 600; }
  img { width: 1280px; display: block; border: 1px solid #2a2f3a; }
</style>
</head>
<body>
<main>
  <h1>The skills band at a three-skill roster</h1>
  <p class="note">Captured from the live game at 1280px on 2026-09-23. The twelve-cell
  band was cut to The Salt Road's roster (forage, mine, build) in the page;
  nothing here is drawn.</p>
  <figure>
    <figcaption>A. four across, fourth slot empty</figcaption>
    <img src="2026-09-23-three-cell-band-a.png" alt="Skills band with three cells in a four-column grid">
  </figure>
  <figure>
    <figcaption>B. one column per skill</figcaption>
    <img src="2026-09-23-three-cell-band-b.png" alt="Skills band with three cells stretched across three columns">
  </figure>
</main>
</body>
</html>
