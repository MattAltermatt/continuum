# The four gates from CLAUDE.md's Definition of Done that a machine can judge.
#
# The fifth -- "verified in Chrome, the change actually visible doing the thing"
# -- is deliberately absent. It is a human looking at the game, and a workflow
# that claimed to cover it would make the other four feel like the whole bar.
#
# One job for the gates, not four. `npm ci` dominates the runtime; splitting the
# gates into parallel jobs would pay for a dependency install three extra times
# to save seconds. Vitest needs no CI configuration: it detects GITHUB_ACTIONS
# and emits workflow annotations on the failing lines by itself.
#
# A second job publishes a push to main that passed these four gates to GitHub
# Pages, https://mattaltermatt.github.io/continuum/: the build the user plays. It
# ships the dist the gates just built, holds the Pages permissions without ever
# running npm, and deploys only while the commit is still main's tip, so
# re-running an old run cannot roll the site back (and a green commit a red one
# has already replaced is not published: fix forward). To redeploy, use "Re-run
# all jobs" on the tip's run (re-runs are allowed for 30 days, the Pages
# artifact is kept for 1), or run this workflow by hand on main, which runs the
# gates again and publishes the tip. Never re-run an older main run. Every push
# to main needs its own run: no paths filters, no [skip ci]. A red deploy job is
# a release failure, not a gate failure: re-run the tip, do not go looking for
# a broken test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A second push to the same branch cancels the first's gates. The gates are a
    # pass/fail on the tip, not a history worth preserving. Job-level, so a
    # deploy already under way is never cancelled by a newer push; and a re-run
    # (attempt 2 on) waits its turn rather than cancelling a newer push's gates.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: ${{ github.run_attempt == 1 }}
    # The artifact is named per attempt: "Re-run all jobs" uploads a second one,
    # and deploy-pages refuses a run holding two of one name. Named once, here.
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    outputs:
      pages_artifact: ${{ env.PAGES_ARTIFACT }}
    # The headless play is a synchronous loop; a broken bound would hang the
    # suite past vitest's per-test timeout, and GitHub's default is 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The version check below diffs from the push's previous tip, which a shallow clone does not hold.
          fetch-depth: 0
      # Pinned from .nvmrc, which tracks the version actually developed against
      # rather than the current LTS line (26 is not LTS; 24 is). A CI that runs a
      # major nobody runs locally reports failures the developer cannot reproduce
      # and misses the ones they can. Only jq and perl are assumed beyond node,
      # and ubuntu-latest ships both.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Ordered cheapest-first so a failure reports the smallest useful thing.
      # typecheck runs both programs: the ship build, and src/engine/ compiled
      # with no DOM library -- the half of the purity wall that catches an
      # ambient reach no import statement shows. See tsconfig.engine.json.
      - name: Typecheck (ship build + engine purity)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The hooks in .claude/hooks/ are a guard layer with its own test suite.
      # An untested guard is decoration, and one that has silently stopped firing
      # is worse than none -- it is a wall everyone believes in.
      - name: Test the hooks themselves
        run: npm run test:hooks

      # Every push to main is a release (CLAUDE.md, Workflow). A release that changed the game carries a new
      # version, so a headless-play stamp names one build. The base is the push's previous tip, not HEAD~1: a
      # push may carry more than one commit. Read-only: the tag itself is a later step, #66.
      - name: The version moved with the game
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          if git diff --quiet "$base" HEAD -- src; then
            echo "src/ unchanged since ${base:0:7}; no bump needed"
            exit 0
          fi
          before=$(git show "$base:package.json" | jq -r .version)
          after=$(jq -r .version package.json)
          if [ "$before" = "$after" ]; then
            echo "::error::src/ changed since ${base:0:7} but package.json is still $after; bump it in the squash commit"
            exit 1
          fi
          echo "$before -> $after"

      - name: Build
        run: npm run build

      # Only main becomes the site (a push, or a run by hand); a pull request, a fork's included, never does.
      - name: Keep the build for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: ${{ env.PAGES_ARTIFACT }}

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A production deploy runs to the end; a newer one waits its turn.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # The guard lives in the deploy job, checked when the job starts (after
      # waiting its turn in "pages"), so a deploy cannot overtake a newer one
      # and a re-run deploy re-checks. The cost: a skipped run still records a
      # github-pages deployment. A failed lookup fails the job rather than
      # passing for "not the tip".
      - name: Only main's current tip
        id: tip
        shell: bash
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          if ! refs=$(git ls-remote --exit-code "https://github.com/$REPO" refs/heads/main); then
            echo "::error::could not read main's tip"
            exit 1
          fi
          tip=$(awk '$2 == "refs/heads/main" { print $1 }' <<<"$refs")
          if [ -z "$tip" ]; then
            echo "::error::could not read main's tip"
            exit 1
          fi
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$SHA is no longer main's tip ($tip); not deploying it"
          fi
      - id: deployment
        if: steps.tip.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.verify.outputs.pages_artifact }}
